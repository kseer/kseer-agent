# Minimal values for the POC — matches what the victim's README command expects.
# Nothing here is malicious: the chart runs a benign busybox pod that echoes a
# fixed banner to stdout.
cluster:
  name: poc-cluster

image:
  repository: docker.io/curlimages/curl
  tag: "8.10.1"
  pullPolicy: IfNotPresent

podAnnotations: {}
