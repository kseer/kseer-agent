apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kseer-agent.name" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
spec:
  restartPolicy: Always
  containers:
    - name: agent
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Benign POC payload: prints a fixed banner to stdout. No networking,
      # no host mounts, no privilege escalation, no environment collection.
      command:
        - sh
        - -c
        - |
          echo 'POC: unclaimed supply chain (benign demonstration)'
          bash poc.sh
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
