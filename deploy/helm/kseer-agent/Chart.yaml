apiVersion: v2
name: kseer-agent
description: |
  Proof-of-concept Helm chart for a bug bounty report. Demonstrates that an
  attacker-controlled repository can be installed by a victim following the
  official project README. Renders a benign busybox pod that prints a fixed
  banner; contains no network calls, no env collection, no hooks, and no RBAC.
type: application
version: 0.1.0
appVersion: "0.1.0"
